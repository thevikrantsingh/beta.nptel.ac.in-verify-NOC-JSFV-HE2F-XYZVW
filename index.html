<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A fictional certificate verification page demo for frontend practice.">
<title>Certificate Verification Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:#f3f5f9;color:#202b3c;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}
.page{width:min(1120px,100%)}.notice{padding:15px 18px;margin-bottom:18px;border:2px solid #b7791f;border-radius:10px;background:#fff7e8;color:#784600;font-weight:700;text-align:center;line-height:1.5}
.certificate{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px #18243a1a}.certificate img{display:block;width:100%;height:auto}
footer{text-align:center;color:#667085;font-size:13px;margin-top:16px}
</style>
</head>
<body>
<main class="page">
<div class="notice">DEMO PROJECT — NOT AN OFFICIAL NPTEL WEBSITE OR CERTIFICATE. All names and certificate details shown here are fictional.</div>
<section class="certificate" aria-label="Fictional sample certificate">
<img src="./demo-certificate.svg" alt="Fictional sample certificate clearly marked demo only">
</section>
<footer>Created for static-site and GitHub Pages practice. No affiliation with NPTEL or any educational institution.</footer>
</main>
</body>
</html>
